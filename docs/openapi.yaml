openapi: 3.0.3
info:
  title: RSS Feeder Web API
  description: |
    cmd/web が提供する JSON API（フロントエンド `web/frontend` から利用）の仕様。
    実装は `internal/adapter/handler/web/` 配下、ルート定義は `cmd/web/main.go` を参照。
  version: "1.0.0"
servers:
  - url: /
paths:
  /api/articles:
    get:
      summary: 記事一覧
      operationId: listArticles
      tags: [articles]
      parameters:
        - $ref: '#/components/parameters/Mode'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: 記事一覧（ページネーション付き）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedArticles'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /api/articles/search:
    get:
      summary: キーワード全文検索
      operationId: searchArticles
      tags: [articles]
      parameters:
        - name: q
          in: query
          required: true
          description: 検索キーワード
          schema:
            type: string
        - name: bookmarked
          in: query
          required: false
          description: true の場合お気に入りのみに絞り込む
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          description: 検索結果（ページネーション付き）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedArticles'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /api/articles/{id}/bookmark:
    post:
      summary: 記事のお気に入りをトグル
      description: お気に入り状態を反転させ、audit_log に記録する。
      operationId: toggleBookmark
      tags: [articles]
      parameters:
        - name: id
          in: path
          required: true
          description: 記事 ID
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: トグル後の記事
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /api/articles/fetch:
    post:
      summary: 登録済み全フィードを取得して DB に保存
      description: CLI の `rss-feeder fetch` と同じ処理（`FetchUsecase.ExecuteAll`）を呼び出す。
      operationId: fetchLatestArticles
      tags: [articles]
      responses:
        "200":
          description: 取得結果（件数集計）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchResult'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /api/categories:
    get:
      summary: 設定済みカテゴリの一覧
      description: 記事に付与済みのカテゴリを重複なく返す（DISTINCT）。
      operationId: listCategories
      tags: [categories]
      responses:
        "200":
          description: カテゴリ名の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "500":
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    Mode:
      name: mode
      in: query
      required: false
      description: 記事の絞り込みモード
      schema:
        $ref: '#/components/schemas/Mode'
    Category:
      name: category
      in: query
      required: false
      description: カテゴリで絞り込む
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: ソート対象フィールド
      schema:
        $ref: '#/components/schemas/Sort'
    Order:
      name: order
      in: query
      required: false
      description: ソート順
      schema:
        $ref: '#/components/schemas/Order'
    Page:
      name: page
      in: query
      required: false
      description: ページ番号（1 始まり）
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: 1 ページあたりの件数
      schema:
        type: integer
        minimum: 1
        default: 25

  responses:
    BadRequest:
      description: リクエストパラメータが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 対象が見つからない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Mode:
      type: string
      description: 記事の絞り込みモード
      enum: [all, unread, bookmarked]
      default: all
    Sort:
      type: string
      description: ソート対象フィールド
      enum: [title, publisher, category, published_at]
      default: published_at
    Order:
      type: string
      description: ソート順
      enum: [asc, desc]
      default: desc

    Article:
      type: object
      required:
        - id
        - feed_id
        - feed_url
        - url
        - title
        - content
        - published_at
        - read
        - bookmarked
        - fetched_at
        - publisher
        - thumbnail_url
        - summary
        - category
      properties:
        id:
          type: integer
          format: int64
        feed_id:
          type: integer
          format: int64
        feed_url:
          type: string
        url:
          type: string
        title:
          type: string
        content:
          type: string
        published_at:
          type: string
          format: date-time
        read:
          type: boolean
        bookmarked:
          type: boolean
        fetched_at:
          type: string
          format: date-time
        publisher:
          type: string
        thumbnail_url:
          type: string
        summary:
          type: string
        category:
          type: string

    PagedArticles:
      type: object
      required: [articles, total, page, per_page]
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        total:
          type: integer
          format: int64
        page:
          type: integer
        per_page:
          type: integer

    FetchResult:
      type: object
      required: [saved, skipped, errors]
      properties:
        saved:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
