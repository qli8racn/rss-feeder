name: CI (Frontend)

on:
  push:
    branches-ignore:
      - main
    paths:
      - "web/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
