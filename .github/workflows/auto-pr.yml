name: Auto Create Pull Request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if not exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          existing=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists for $BRANCH"
            exit 0
          fi

          title=$(git log -1 --pretty=%s)

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body "Auto-generated PR from branch \`$BRANCH\`." \
            --draft
